name: Deploy

# Dispara depois que o workflow de CI terminar com sucesso em main — nunca publica um commit que
# não passou em build/vet/test/lint (ver Docs/ArqLearn_Estrategia_Bootstrap.md §8.3). Inerte até
# os secrets (RENDER_DEPLOY_HOOK_URL, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) serem
# cadastrados em Settings → Secrets and variables → Actions do repositório.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy-backend:
    name: Render — services/monolith
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Render já está conectado direto ao repositório (Auto-Deploy desligado no dashboard —
      # ver Estrategia_Bootstrap.md §8.1) — só falta disparar o build via Deploy Hook, a mesma
      # URL configurada como secret. Sem checkout: não precisa do código aqui, só da chamada HTTP.
      - name: Dispara deploy no Render
        run: |
          curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            || (echo "Falha ao disparar o deploy hook do Render" && exit 1)

  deploy-frontend:
    name: Vercel — apps/web
    # Desligado de propósito (a pedido do usuário, 08/2026): por enquanto só o backend (Render)
    # publica automaticamente. Reativar trocando pra `github.event.workflow_run.conclusion ==
    # 'success'` assim que VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID estiverem cadastrados
    # (ver Docs/ArqLearn_Estrategia_Bootstrap.md §8.3).
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instala Vercel CLI
        run: npm install --global vercel@latest

      # --yes: usa a config já vinculada em apps/web/.vercel/project.json (criada uma vez, local,
      # via `vercel link` — ver Estrategia_Bootstrap.md §8.3), sem pedir input interativo.
      - name: Puxa config do ambiente de produção
        working-directory: apps/web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        working-directory: apps/web
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        working-directory: apps/web
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
