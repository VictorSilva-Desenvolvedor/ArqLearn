name: Deploy

# Dispara depois que o workflow de CI terminar com sucesso em main — nunca publica um commit que
# não passou em build/vet/test/lint (ver Docs/ArqLearn_Estrategia_Bootstrap.md §8.3). Inerte até
# os secrets (RENDER_DEPLOY_HOOK_URL, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) serem
# cadastrados em Settings → Secrets and variables → Actions do repositório.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy-backend:
    name: Render — services/monolith
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Render já está conectado direto ao repositório (Auto-Deploy desligado no dashboard —
      # ver Estrategia_Bootstrap.md §8.1) — só falta disparar o build via Deploy Hook, a mesma
      # URL configurada como secret. Sem checkout: não precisa do código aqui, só da chamada HTTP.
      - name: Dispara deploy no Render
        run: |
          curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            || (echo "Falha ao disparar o deploy hook do Render" && exit 1)

  deploy-frontend:
    name: Vercel — apps/web
    # Reativado (08/2026): VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID cadastrados, projeto
    # "arqlearn" criado no escopo pessoal da Vercel (victorpaulodev-4099s-projects) — ver
    # Docs/ArqLearn_Estrategia_Bootstrap.md §8.3.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # VERCEL_ORG_ID/VERCEL_PROJECT_ID no nível do job (não só no último step): `vercel pull`
    # reconstrói apps/web/.vercel/project.json a partir dessas duas env vars — o arquivo em si é
    # local/gitignored (Estrategia_Bootstrap.md §8.3, gerado uma vez via `vercel link`), não vem
    # no checkout do runner. Sem as duas env vars já no step de pull, a conta tendo mais de um
    # time (pessoal + VigorHub) faz o CLI falhar com "Multiple teams found" por não ter time
    # implícito num terminal não-interativo — descoberto ao vivo no primeiro deploy real.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instala Vercel CLI
        run: npm install --global vercel@latest

      # Na raiz, não em apps/web: o repo é workspace npm (apps/web + apps/mobile,
      # package.json raiz) — npm workspaces faz hoist de tudo pra node_modules da raiz,
      # apps/web/node_modules nunca existe. Mesmo padrão que ci.yml já usa.
      - name: Instala dependências (workspace)
        run: npm install

      # A partir da raiz do repo (não com working-directory: apps/web) — é o Root Directory do
      # projeto na Vercel (configurado como apps/web via API, ver Docs/ArqLearn_Estrategia_
      # Bootstrap.md §8.3) que direciona o CLI pro subdiretório certo, mas mantendo consciência
      # do monorepo pra resolver node_modules hoisted na raiz. Com working-directory: apps/web
      # (tentativa anterior), `vercel deploy --prebuilt` fazia uma checagem de caminho literal
      # relativo ao cwd por apps/web/node_modules/@swc/helpers/... — que nunca existe nesse
      # layout — e falhava com "File does not exist", mesmo o `vercel build` funcionando (Next.js
      # resolve módulo subindo diretório, a checagem do deploy não). Descoberto ao vivo no
      # primeiro deploy real.
      - name: Puxa config do ambiente de produção
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
