name: Deploy

# Dispara depois que o workflow de CI terminar com sucesso em main — nunca publica um commit que
# não passou em build/vet/test/lint (ver Docs/ArqLearn_Estrategia_Bootstrap.md §8.3). Inerte até
# os secrets (FLY_API_TOKEN, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) serem cadastrados à
# mão em Settings → Secrets and variables → Actions do repositório — nenhum agente de IA tem
# acesso a essa tela, é uma ação manual de quem administra o repo.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy-backend:
    name: Fly.io — services/monolith
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: fly deploy
        working-directory: services/monolith
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    name: Vercel — apps/web
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instala Vercel CLI
        run: npm install --global vercel@latest

      # --yes: usa a config já vinculada em apps/web/.vercel/project.json (criada uma vez, local,
      # via `vercel link` — ver Estrategia_Bootstrap.md §8.3), sem pedir input interativo.
      - name: Puxa config do ambiente de produção
        working-directory: apps/web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        working-directory: apps/web
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        working-directory: apps/web
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
