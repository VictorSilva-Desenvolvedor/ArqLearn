name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [services/monolith, services/ai-content-pipeline]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt (falha se algum arquivo não estiver formatado)
        run: test -z "$(gofmt -l .)"

      - name: go test
        run: go test ./... -v

  web:
    name: apps/web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - name: next build
        run: npm run build --workspace=apps/web

  mobile:
    name: apps/mobile (Expo/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - name: tsc --noEmit
        run: npm exec --workspace=apps/mobile -- tsc --noEmit
