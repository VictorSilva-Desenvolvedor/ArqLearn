<style>
        /* Drafting Table Grid Pattern */
        .bg-drafting-grid {
            background-color: theme('colors.background');
            background-image: 
                linear-gradient(theme('colors.blueprint-grid') 1px, transparent 1px),
                linear-gradient(90deg, theme('colors.blueprint-grid') 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: center center;
        }

        /* Subtle ambient pulse for the loading state */
        @keyframes pulse-soft {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-drafting-grid min-h-screen w-full flex flex-col items-center justify-between p-lg md:p-xl relative overflow-hidden font-body-lg text-body-lg text-on-background selection:bg-primary selection:text-on-primary">
<!-- Top Spacer to push content down slightly -->
<div class="h-12 w-full"></div>
<!-- Center Content: Animation & Logo -->
<main class="flex flex-col items-center justify-center space-y-xl z-10 w-full max-w-sm">
<!-- Animation Wrapper -->
<div class="relative w-48 h-48 md:w-64 md:h-64 flex items-center justify-center">
<!-- Decorative technical corners behind animation -->
<div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-primary-container opacity-50"></div>
<div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-primary-container opacity-50"></div>
<div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-primary-container opacity-50"></div>
<div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-primary-container opacity-50"></div>
<!-- STITCH_SVG_START:ANIMATION_32 class="w-full h-full object-contain" --><div class="w-full h-full object-contain" id="animated-svg-ANIMATION_32" style="display:block;"><animated-loading-blueprint>
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Grid Background -->
<svg class="absolute inset-0 w-full h-full text-blue-200/30" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="10" id="grid" patternunits="userSpaceOnUse" width="10">
<path d="M 10 0 L 0 0 0 10" fill="none" stroke="currentColor" stroke-width="0.5"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="100" width="100"></rect>
</svg>
<!-- Animated Blueprint Building -->
<svg class="w-48 h-48 text-[#2E5C8A]" fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<style>
        .path {
          stroke-dasharray: 200;
          stroke-dashoffset: 200;
          animation: draw 3s ease-in-out infinite;
        }
        @keyframes draw {
          0% { stroke-dashoffset: 200; opacity: 0; }
          20% { opacity: 1; }
          50% { stroke-dashoffset: 0; }
          80% { opacity: 1; }
          100% { stroke-dashoffset: 0; opacity: 0; }
        }
        .pencil {
          animation: move-pencil 3s ease-in-out infinite;
        }
        @keyframes move-pencil {
          0% { transform: translate(10px, 80px); opacity: 0; }
          10% { opacity: 1; }
          50% { transform: translate(50px, 20px); }
          80% { opacity: 1; }
          100% { transform: translate(90px, 80px); opacity: 0; }
        }
      </style>
<!-- Ground Line -->
<path class="path" d="M10 80 H90" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
<!-- Building Outline -->
<path class="path" d="M20 80 V40 L50 20 L80 40 V80 H20" stroke="currentColor" stroke-linejoin="round" stroke-width="2"></path>
<!-- Window/Detail -->
<path class="path" d="M40 50 H60 V70 H40 Z" stroke="currentColor" stroke-dasharray="4 2" stroke-width="1.5"></path>
<!-- Pencil/Drafting Tool Indicator -->
<g class="pencil">
<circle cx="0" cy="0" fill="#C77B3B" r="2"></circle>
<line stroke="#C77B3B" stroke-width="2" x1="0" x2="-5" y1="0" y2="10"></line>
</g>
</svg>
<!-- Pulse Effect -->
<div class="absolute inset-0 rounded-full border-4 border-[#2E5C8A]/20 animate-ping"></div>
</div>
</animated-loading-blueprint></div><!-- STITCH_SVG_END:ANIMATION_32 -->
</div>
<!-- Logo Wrapper -->
<div class="w-full px-sm flex justify-center">
<img alt="ArqLearn Logo" class="w-40 md:w-48 h-auto object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtTXzpyOInfcLmoENjjP6Vh6ibUEkFMsL8mv4mz0eQCcA6WPVoLy55fSfrOsoB2UUFRRTvYy0Thxo33isPF9h7vImjZPvyOZNrSDL6H7HOrZhcWpx5Sre-xbReOO9gWrVVVAI6AExnmNBJODwV_xNMNbKTeAgsKxt3KJMxlkOnTRf1TP7pDhym2hrVVFEaafALf9NVPhJ7NxU7sTeYzAOhEnOq6uR_QN4OX7ldqqpLB3clBdThawaZxQp4"/>
</div>
</main>
<!-- Bottom Content: Loading Text -->
<footer class="w-full flex justify-center pb-md z-10">
<p class="font-headline-md text-headline-md text-on-surface-variant text-center animate-pulse-soft">
            Projetando o futuro da arquitetura...
        </p>
</footer>
<!-- Subtle vignette effect to focus center -->
<div class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-transparent via-transparent to-background opacity-60"></div>
</body></html>
