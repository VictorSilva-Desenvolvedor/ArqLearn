<style>

            background-image: 
                linear-gradient(to right, #E5E7EB 1px, transparent 1px),
                linear-gradient(to bottom, #E5E7EB 1px, transparent 1px);

            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        
        .answer-card:hover {
            border-color: #0e4471;
            background-color: #f8f9ff;
        }
        
        .answer-card.selected {
            border-color: #0e4471;
            border-width: 2px;

        }

<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col drafting-grid">
<!-- Note: TopAppBar and BottomNavBar are suppressed here as this is a linear/transactional task (a Quiz session), 
         which implies a temporary departure from the main navigation flow. Progressive disclosure prioritizes the content canvas. -->
<!-- Header: Progress & Gamification Stats -->
<header class="w-full flex items-center justify-between p-md max-w-container-max mx-auto backdrop-blur-md bg-surface-bright/80 sticky top-0 z-10 border-b border-blueprint-grid">
<!-- Close / Exit Lesson -->
<button class="text-outline hover:text-primary transition-colors flex items-center justify-center p-2 rounded-full hover:bg-surface-gray">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<!-- Lesson Progress Bar -->
<div class="flex-1 mx-lg">
<div class="h-1.5 w-full bg-surface-gray rounded-full overflow-hidden progress-tube border border-blueprint-grid">
<div class="h-full bg-primary rounded-full" style="width: 65%;"></div>
</div>
</div>
<!-- Gamification Stats -->
<div class="flex items-center space-x-md">
<div class="flex items-center space-x-xs">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="font-stats-num text-stats-num text-secondary">3</span>
</div>
<div class="flex items-center space-x-xs">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">diamond</span>
<span class="font-stats-num text-stats-num text-secondary-container">120</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-2xl mx-auto p-lg flex flex-col justify-center pb-section">
<!-- Question Section -->
<div class="mb-xl text-center space-y-md">

</div>

<div class="mb-lg w-full h-48 md:h-64 rounded-xl overflow-hidden border-2 border-outline-variant bg-surface-gray relative group">
<img class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity" data-alt="A highly detailed architectural elevation drawing of a classic Gothic cathedral facade. The drawing features intricate line work, pointed arches, ribbed vaults, and flying buttresses. It is presented in a modern light-mode aesthetic, utilizing precise 2px drafting strokes in deep blue on a pristine white background. A subtle, technical grid pattern underlays the image, reinforcing the educational and professional architectural context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBfGGWwIa221gFr28OI4ULyIvf_qIlIdviU8d0rMxTs7tjnACJ6HQbIm9tuG48i435bGrzTTg-oCSu5VbHlzyLMeIc1Z1NEXOtOlZfv0_tMnT7H6Zh_l5bKU2-OIbapC9If1OWGaz25-Cv_KV5ZQff4nMS0b1Wa6DCh3D8aq-dMAa7VLqg38vM97851trI4uo7-hcYWOzhQneleM2zggLsdNgiZQrT-gFcx0LsZ_xBvZqdx9wx7sYXouw"/>

</div>

<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">architecture</span>

<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>

<button class="answer-card w-full p-md min-h-[80px] bg-white border border-blueprint-grid rounded-xl flex items-center justify-between text-left group">

                Pular
            </button>
<button class="px-xl py-sm bg-secondary text-white font-body-md font-bold rounded-lg border-b-4 border-on-secondary-container hover:translate-y-[2px] hover:border-b-2 active:translate-y-[4px] active:border-b-0 transition-all shadow-md">
                Verificar
            </button>
</div>

<!-- Script for basic interaction demo -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.answer-card');
            cards.forEach(card => {
                card.addEventListener('click', function() {
                    // Remove selected from all
                    cards.forEach(c => {
                        c.classList.remove('selected');
                        const icon = c.querySelector('.material-symbols-outlined');
                        // Reset icon to default based on content if needed, but for simplicity here we just toggle the visual state
                        if(c !== this && c.classList.contains('selected')) {
                             icon.style.fontVariationSettings = "'FILL' 0";
                        }
                    });
                    
                    // Add to clicked
                    this.classList.add('selected');
                    // In a real app, you'd swap the icon to a checkmark here dynamically
                });
            });
        });
    </script>
