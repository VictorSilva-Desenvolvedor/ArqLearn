<script>
        // Simple JS to generate architectural confetti (triangles, squares, rulers)
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const icons = ['change_history', 'square', 'architecture', 'straighten'];
            const colors = ['text-brand-orange', 'text-primary-fixed-dim', 'text-outline-variant'];
            
            const createConfetti = () => {
                const el = document.createElement('span');
                el.classList.add('material-symbols-outlined', 'confetti-piece');
                
                // Randomize icon
                const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                el.innerText = randomIcon;
                
                // Randomize color
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                el.classList.add(randomColor);
                
                // Randomize position, size, and animation delay
                const left = Math.random() * 100;
                const delay = Math.random() * 5;
                const duration = 3 + Math.random() * 4;
                const size = 16 + Math.random() * 24;
                
                el.style.left = `${left}%`;
                el.style.animationDelay = `${delay}s`;
                el.style.animationDuration = `${duration}s`;
                el.style.fontSize = `${size}px`;
                
                // Fill some randomly
                if(Math.random() > 0.5) {
                    el.style.fontVariationSettings = "'FILL' 1";
                }
                
                container.appendChild(el);
            };

            // Generate 30 pieces
            for(let i=0; i<30; i++) {
                createConfetti();
            }
        });
    </script>
