<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_32 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_32" style="display:block;"><animated-loading-blueprint>
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Grid Background -->
<svg class="absolute inset-0 w-full h-full text-blue-200/30" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="10" id="grid" patternunits="userSpaceOnUse" width="10">
<path d="M 10 0 L 0 0 0 10" fill="none" stroke="currentColor" stroke-width="0.5"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="100" width="100"></rect>
</svg>
<!-- Animated Blueprint Building -->
<svg class="w-48 h-48 text-[#2E5C8A]" fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<style>
        .path {
          stroke-dasharray: 200;
          stroke-dashoffset: 200;
          animation: draw 3s ease-in-out infinite;
        }
        @keyframes draw {
          0% { stroke-dashoffset: 200; opacity: 0; }
          20% { opacity: 1; }
          50% { stroke-dashoffset: 0; }
          80% { opacity: 1; }
          100% { stroke-dashoffset: 0; opacity: 0; }
        }
        .pencil {
          animation: move-pencil 3s ease-in-out infinite;
        }
        @keyframes move-pencil {
          0% { transform: translate(10px, 80px); opacity: 0; }
          10% { opacity: 1; }
          50% { transform: translate(50px, 20px); }
          80% { opacity: 1; }
          100% { transform: translate(90px, 80px); opacity: 0; }
        }
      </style>
<!-- Ground Line -->
<path class="path" d="M10 80 H90" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
<!-- Building Outline -->
<path class="path" d="M20 80 V40 L50 20 L80 40 V80 H20" stroke="currentColor" stroke-linejoin="round" stroke-width="2"></path>
<!-- Window/Detail -->
<path class="path" d="M40 50 H60 V70 H40 Z" stroke="currentColor" stroke-dasharray="4 2" stroke-width="1.5"></path>
<!-- Pencil/Drafting Tool Indicator -->
<g class="pencil">
<circle cx="0" cy="0" fill="#C77B3B" r="2"></circle>
<line stroke="#C77B3B" stroke-width="2" x1="0" x2="-5" y1="0" y2="10"></line>
</g>
</svg>
<!-- Pulse Effect -->
<div class="absolute inset-0 rounded-full border-4 border-[#2E5C8A]/20 animate-ping"></div>
</div>
</animated-loading-blueprint></div><!-- STITCH_SVG_END:ANIMATION_32 -->
</body>
</html>
