        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Blueprint Grid Background */
        .bg-blueprint {
            background-color: #f8f9ff;
            background-image: 
                linear-gradient(rgba(46, 92, 138, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46, 92, 138, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(46, 92, 138, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46, 92, 138, 0.02) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            background-position: -2px -2px, -2px -2px, -1px -1px, -1px -1px;
        }
        
        /* Glow Animation for Chest */
        @keyframes subtle-glow {
            0% { filter: drop-shadow(0 0 15px rgba(253, 168, 100, 0.4)); transform: translateY(0); }
            50% { filter: drop-shadow(0 0 25px rgba(253, 168, 100, 0.7)); transform: translateY(-4px); }
            100% { filter: drop-shadow(0 0 15px rgba(253, 168, 100, 0.4)); transform: translateY(0); }
        }
        .animate-chest-glow {
            animation: subtle-glow 3s ease-in-out infinite;
        }

        /* Floating elements animation */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .float-delay-1 { animation: float 4s ease-in-out infinite; }
        .float-delay-2 { animation: float 4.5s ease-in-out infinite 0.5s; }
        .float-delay-3 { animation: float 5s ease-in-out infinite 1s; }
    </style>
