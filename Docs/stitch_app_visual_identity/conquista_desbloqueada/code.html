<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Conquista Desbloqueada - ArqLearn</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#ffdcc4",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-variant": "#d9e3f6",
                        "inverse-primary": "#9fcafe",
                        "primary-container": "#2e5c8a",
                        "secondary-container": "#fda864",
                        "muted-text": "#6B7280",
                        "tertiary-fixed": "#a3f69c",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#2f1400",
                        "on-secondary-fixed-variant": "#6f3800",
                        "error-red": "#B00020",
                        "on-tertiary-fixed-variant": "#005312",
                        "primary": "#0e4471",
                        "outline": "#727780",
                        "tertiary-container": "#156820",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f8f9ff",
                        "blueprint-grid": "#E5E7EB",
                        "surface-dim": "#d0dbed",
                        "on-error": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#34618f",
                        "surface-container": "#e6eeff",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#92e58c",
                        "secondary": "#8f4e0f",
                        "primary-fixed-dim": "#9fcafe",
                        "tertiary": "#004e10",
                        "outline-variant": "#c2c7d0",
                        "surface-container-highest": "#d9e3f6",
                        "secondary-fixed-dim": "#ffb780",
                        "primary-fixed": "#d1e4ff",
                        "on-surface-variant": "#42474f",
                        "background": "#f8f9ff",
                        "on-primary-container": "#b2d4ff",
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#753c00",
                        "on-surface": "#121c2a",
                        "inverse-surface": "#27313f",
                        "tertiary-fixed-dim": "#88d982",
                        "surface-gray": "#F3F4F6",
                        "on-tertiary": "#ffffff",
                        "surface": "#f8f9ff",
                        "on-primary-fixed-variant": "#164976",
                        "surface-container-high": "#dee9fc",
                        "on-tertiary-fixed": "#002204",
                        "on-primary-fixed": "#001d36",
                        "on-background": "#121c2a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "8px",
                        "xl": "32px",
                        "container-max": "1120px",
                        "section": "48px",
                        "md": "16px",
                        "lg": "24px",
                        "base": "4px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "question-sm": ["Hanken Grotesk"],
                        "stats-num": ["JetBrains Mono"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "display-lg": ["Hanken Grotesk"],
                        "question-lg": ["Hanken Grotesk"],
                        "body-sm": ["Inter"],
                        "label-caps": ["JetBrains Mono"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "question-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "stats-num": ["22px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "display-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "question-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .blueprint-pattern {
            background-size: 20px 20px;
            background-image: 
                linear-gradient(to right, #E5E7EB 1px, transparent 1px),
                linear-gradient(to bottom, #E5E7EB 1px, transparent 1px);
        }
        .achievement-glow {
            box-shadow: 0 0 40px rgba(253, 168, 100, 0.4);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-hidden font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Architectural Motifs Background -->
<div class="absolute inset-0 blueprint-pattern opacity-50 z-0 pointer-events-none"></div>
<div class="absolute top-0 right-0 w-64 h-64 border-l-2 border-b-2 border-primary/10 rounded-bl-3xl z-0 pointer-events-none transform translate-x-1/4 -translate-y-1/4"></div>
<div class="absolute bottom-0 left-0 w-96 h-96 border-t-2 border-r-2 border-primary/10 rounded-tr-3xl z-0 pointer-events-none transform -translate-x-1/4 translate-y-1/4"></div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-lg md:p-xl relative z-10 w-full max-w-container-max mx-auto">
<!-- Achievement Container -->
<div class="w-full max-w-md bg-surface-lowest border-2 border-outline-variant rounded-xl p-xl flex flex-col items-center text-center relative achievement-glow">
<!-- Technical Framing Accents -->
<div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-primary transform -translate-x-[2px] -translate-y-[2px]"></div>
<div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-primary transform translate-x-[2px] -translate-y-[2px]"></div>
<div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-primary transform -translate-x-[2px] translate-y-[2px]"></div>
<div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-primary transform translate-x-[2px] translate-y-[2px]"></div>
<!-- Header -->
<p class="font-label-caps text-label-caps text-primary tracking-widest uppercase mb-sm">Conquista Desbloqueada</p>
<!-- Badge Graphic -->
<div class="relative w-40 h-40 mb-lg flex items-center justify-center">
<!-- Hexagon Base -->
<svg class="w-full h-full text-secondary-container drop-shadow-md" viewbox="0 0 100 100">
<polygon fill="currentColor" points="50,5 95,25 95,75 50,95 5,75 5,25" stroke="#8f4e0f" stroke-width="2"></polygon>
<polygon fill="none" points="50,12 88,30 88,70 50,88 12,70 12,30" stroke="#fff" stroke-dasharray="4,4" stroke-width="2"></polygon>
</svg>
<!-- Icon -->
<span class="material-symbols-outlined absolute text-[64px] text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">
                    foundation
                </span>
</div>
<!-- Achievement Details -->
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Mestre das Estruturas</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg max-w-[280px]">
                Você completou 5 lições consecutivas sobre fundações e vigas sem erros. Uma base sólida para um grande arquiteto!
            </p>
<!-- Rewards Section -->
<div class="w-full bg-surface-gray border border-outline-variant rounded-lg p-md mb-xl flex justify-center gap-xl relative">
<!-- Technical label for rewards -->
<div class="absolute -top-[10px] left-1/2 transform -translate-x-1/2 bg-surface-gray px-2">
<span class="font-label-caps text-label-caps text-muted-text">Recompensas</span>
</div>
<!-- XP -->
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-[24px]">
                        military_tech
                    </span>
<span class="font-stats-num text-stats-num text-primary">+50 XP</span>
</div>
<!-- Gems -->
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-secondary-container text-[24px]" style="font-variation-settings: 'FILL' 1;">
                        diamond
                    </span>
<span class="font-stats-num text-stats-num text-secondary">+10</span>
</div>
</div>
<!-- CTA -->
<button class="w-full bg-secondary-container text-on-secondary-container border-b-4 border-secondary font-headline-md text-headline-md py-sm px-xl rounded-xl hover:bg-secondary-fixed hover:translate-y-[2px] hover:border-b-2 active:translate-y-[4px] active:border-b-0 transition-all cursor-pointer">
                Continuar
            </button>
</div>
</main>
</body></html>
