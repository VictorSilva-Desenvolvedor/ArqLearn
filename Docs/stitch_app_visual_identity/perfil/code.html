            background-color: #f8f9ff;
            background-image: 
                linear-gradient(#E5E7EB 1px, transparent 1px),
                linear-gradient(90deg, #E5E7EB 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col blueprint-bg">
<!-- TopAppBar -->
<header class="bg-surface-bright dark:bg-on-background border-b-2 border-outline-variant dark:border-outline flex justify-between items-center px-lg py-md w-full sticky top-0 z-40 backdrop-blur-md bg-opacity-90">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" style="font-variation-settings: 'FILL' 1;">architecture</span>
<h1 class="font-display-lg text-display-lg font-bold text-primary dark:text-primary-fixed">ArqLearn</h1>
</div>
<div class="flex items-center hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors scale-95 active:transition-transform px-sm py-xs rounded-lg cursor-pointer border border-transparent hover:border-outline-variant">
<span class="font-stats-num text-stats-num text-secondary">520 XP</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[container-max] mx-auto px-md py-lg pb-32 flex flex-col gap-lg">
<!-- Profile Identity Card (Bento Cell 1) -->
<section class="bg-surface border border-outline-variant rounded-xl p-md flex items-center gap-md">
<div class="w-20 h-20 rounded-full overflow-hidden border-2 border-primary-fixed shrink-0 bg-surface-container">
<img class="w-full h-full object-cover" data-alt="A clean, minimalist 2D vector illustration of an architect avatar. The avatar is gender-neutral, wearing professional attire with subtle geometric drafting lines integrated into their clothing. The background is a solid, light blueprint grid pattern. Colors utilize primary blue, crisp white, and deep slate gray for a professional, technical aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuArlwB2MZBMBKraLisnhEm--rjMQmv_yx6PeLwyaTk_N0BXE8JsHbKD_OJ4-PLwUV7fWxHxKJiyeOweEBNf8aOrMzcqeG5aigPzJFcLObxnd-P79Qrmsc5NypGIrRfkjhMIMvBITPwjFO9w3t3eIjzEJovsd2kxYwkGHPpgpGz5uq4k2vhBb4rJeSep8Oh0QysdcnvroNOAonDvR2ibdpCSe5WYkGyTCR6am5pTiTp8AhiBPjP3CGKnBQ"/>
</div>
<div class="flex flex-col flex-1">
<h2 class="font-headline-md text-headline-md text-on-surface leading-tight">Alex Silva</h2>
<div class="flex items-center gap-xs mt-xs text-muted-text">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="font-label-caps text-label-caps uppercase">Nível 8 • Arquiteto Júnior</span>
</div>
<!-- XP Tube Progress -->
<div class="w-full h-2 bg-surface-variant rounded-full mt-sm overflow-hidden border border-outline-variant">
<div class="h-full bg-secondary-container w-[65%] rounded-full relative">
<div class="absolute right-0 top-0 bottom-0 w-4 bg-secondary opacity-20"></div>
</div>
</div>
</div>
</section>
<!-- Stats Grid (Bento Cells 2-4) -->
<section class="grid grid-cols-3 gap-xs">
<div class="bg-surface border border-outline-variant rounded-lg p-sm flex flex-col items-center justify-center text-center">
<span class="material-symbols-outlined text-secondary mb-xs text-[28px]" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-stats-num text-stats-num text-on-surface">12</span>
<span class="font-label-caps text-label-caps text-muted-text">Dias</span>
</div>
<div class="bg-surface border border-outline-variant rounded-lg p-sm flex flex-col items-center justify-center text-center opacity-80">
<span class="material-symbols-outlined text-muted-text mb-xs text-[28px]">calendar_month</span>
<span class="font-stats-num text-stats-num text-on-surface">24</span>
<span class="font-label-caps text-label-caps text-muted-text">Máximo</span>
</div>
<div class="bg-surface border border-outline-variant rounded-lg p-sm flex flex-col items-center justify-center text-center">
<span class="material-symbols-outlined text-primary mb-xs text-[28px]" style="font-variation-settings: 'FILL' 1;">diamond</span>
<span class="font-stats-num text-stats-num text-on-surface">850</span>
<span class="font-label-caps text-label-caps text-muted-text">Gemas</span>
</div>
</section>
<!-- Achievements Grid -->
<section class="flex flex-col gap-sm mt-sm">
<div class="flex items-center justify-between">
<h3 class="font-question-lg text-question-lg text-on-surface">Conquistas</h3>
<span class="font-label-caps text-label-caps text-primary cursor-pointer hover:underline">Ver todas</span>
</div>
<div class="grid grid-cols-4 gap-xs">
<!-- Unlocked 1 -->
<div class="aspect-square bg-surface-container border-2 border-primary-fixed rounded-lg flex items-center justify-center relative overflow-hidden group cursor-pointer transition-transform hover:scale-105 shadow-sm">
<span class="material-symbols-outlined text-secondary text-[40px]" style="font-variation-settings: 'FILL' 1;">foundation</span>
<div class="absolute inset-x-0 bottom-0 bg-primary-container py-1 text-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="font-label-caps text-label-caps text-on-primary-container text-[10px]">Fundações</span>
</div>
</div>
<!-- Unlocked 2 -->
<div class="aspect-square bg-surface-container border-2 border-primary-fixed rounded-lg flex items-center justify-center relative overflow-hidden group cursor-pointer transition-transform hover:scale-105 shadow-sm">
<span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: 'FILL' 1;">domain</span>
<div class="absolute inset-x-0 bottom-0 bg-primary-container py-1 text-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="font-label-caps text-label-caps text-on-primary-container text-[10px]">Urbanismo</span>
</div>
</div>
<!-- Unlocked 3 -->
<div class="aspect-square bg-surface-container border-2 border-primary-fixed rounded-lg flex items-center justify-center relative overflow-hidden group cursor-pointer transition-transform hover:scale-105 shadow-sm">
<span class="material-symbols-outlined text-tertiary-container text-[40px]" style="font-variation-settings: 'FILL' 1;">park</span>
<div class="absolute inset-x-0 bottom-0 bg-primary-container py-1 text-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="font-label-caps text-label-caps text-on-primary-container text-[10px]">Paisagismo</span>
</div>
</div>
<!-- Locked 1 -->
<div class="aspect-square bg-surface border border-dashed border-outline-variant rounded-lg flex items-center justify-center opacity-50 grayscale cursor-not-allowed">
<span class="material-symbols-outlined text-outline text-[40px]">roofing</span>
</div>
<!-- Locked 2 -->
<div class="aspect-square bg-surface border border-dashed border-outline-variant rounded-lg flex items-center justify-center opacity-50 grayscale cursor-not-allowed">
<span class="material-symbols-outlined text-outline text-[40px]">construction</span>
</div>
<!-- Locked 3 -->
<div class="aspect-square bg-surface border border-dashed border-outline-variant rounded-lg flex items-center justify-center opacity-50 grayscale cursor-not-allowed">
<span class="material-symbols-outlined text-outline text-[40px]">straighten</span>
</div>
</div>
</section>
<!-- Actions / Navigation within Profile -->
<section class="flex flex-col gap-xs mt-sm">
<button class="w-full flex items-center justify-between p-md bg-surface border border-outline-variant rounded-lg hover:border-primary hover:bg-surface-container-low transition-all active:scale-[0.98]">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container text-sm">storefront</span>
</div>
<span class="font-question-sm text-question-sm text-on-surface">Loja</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-md bg-surface border border-outline-variant rounded-lg hover:border-primary hover:bg-surface-container-low transition-all active:scale-[0.98]">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded bg-surface-variant flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant text-sm">settings</span>
</div>
<span class="font-question-sm text-question-sm text-on-surface">Configurações</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
</section>

<nav class="bg-surface-lowest dark:bg-on-background docked full-width bottom-0 rounded-t-xl border-t-2 border-outline-variant dark:border-outline shadow-md fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-md pb-safe pt-xs md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary-fixed hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors tap-highlight-transparent active:scale-90 w-full">
<span class="material-symbols-outlined text-[24px] mb-1">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary-fixed hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors tap-highlight-transparent active:scale-90 w-full">
<span class="material-symbols-outlined text-[24px] mb-1">explore</span>

</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary-fixed hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors tap-highlight-transparent active:scale-90 w-full">
<span class="material-symbols-outlined text-[24px] mb-1">leaderboard</span>
<span class="font-label-caps text-label-caps">Liga</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-xl px-4 py-1 tap-highlight-transparent active:scale-90 transition-all w-full">
<span class="material-symbols-outlined text-[24px] mb-1" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-caps text-label-caps">Perfil</span>
</button>
</nav>
